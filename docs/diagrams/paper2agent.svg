<svg xmlns="http://www.w3.org/2000/svg" id="paper2agent-flow" width="385.3515625" class="flowchart" style="max-width:100%;height:auto;background-color:#ffffff" viewBox="0 0 385.3515625 802.3999633789062" role="img" height="802.3999633789062" aria-labelledby="paper2agent-title paper2agent-description"><title id="paper2agent-title">Paper2Agent 从论文代码生成工具并验证的流程</title><desc id="paper2agent-description">配置环境并寻找示例，运行示例取得参考输出，整理工具后对照参考输出测试。可修复的失败返回实现步骤，反复失败记录原因并排除，通过的工具组成 MCP 服务，供 Agent 调用。</desc><rect x="0" y="0" width="385.3515625" height="802.3999633789062" fill="#ffffff"/><style>#paper2agent-flow{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;font-size:16px;fill:#172033;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#paper2agent-flow .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#paper2agent-flow .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#paper2agent-flow .error-icon{fill:hsl(30, 40%, 100%);}#paper2agent-flow .error-text{fill:rgb(0, 0, 0);stroke:rgb(0, 0, 0);}#paper2agent-flow .edge-thickness-normal{stroke-width:1px;}#paper2agent-flow .edge-thickness-thick{stroke-width:3.5px;}#paper2agent-flow .edge-pattern-solid{stroke-dasharray:0;}#paper2agent-flow .edge-thickness-invisible{stroke-width:0;fill:none;}#paper2agent-flow .edge-pattern-dashed{stroke-dasharray:3;}#paper2agent-flow .edge-pattern-dotted{stroke-dasharray:2;}#paper2agent-flow .marker{fill:#64748b;stroke:#64748b;}#paper2agent-flow .marker.cross{stroke:#64748b;}#paper2agent-flow svg{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;font-size:16px;}#paper2agent-flow p{margin:0;}#paper2agent-flow .label{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;color:#172033;}#paper2agent-flow .cluster-label text{fill:rgb(0, 0, 0);}#paper2agent-flow .cluster-label span{color:rgb(0, 0, 0);}#paper2agent-flow .cluster-label span p{background-color:transparent;}#paper2agent-flow .label text,#paper2agent-flow span{fill:#172033;color:#172033;}#paper2agent-flow .node rect,#paper2agent-flow .node circle,#paper2agent-flow .node ellipse,#paper2agent-flow .node polygon,#paper2agent-flow .node path{fill:#f1f5f9;stroke:#64748b;stroke-width:1px;}#paper2agent-flow .rough-node .label text,#paper2agent-flow .node .label text,#paper2agent-flow .image-shape .label,#paper2agent-flow .icon-shape .label{text-anchor:middle;}#paper2agent-flow .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#paper2agent-flow .rough-node .label,#paper2agent-flow .node .label,#paper2agent-flow .image-shape .label,#paper2agent-flow .icon-shape .label{text-align:center;}#paper2agent-flow .node.clickable{cursor:pointer;}#paper2agent-flow .root .anchor path{fill:#64748b!important;stroke-width:0;stroke:#64748b;}#paper2agent-flow .arrowheadPath{fill:#000000;}#paper2agent-flow .edgePath .path{stroke:#64748b;stroke-width:2.0px;}#paper2agent-flow .flowchart-link{stroke:#64748b;fill:none;}#paper2agent-flow .edgeLabel{background-color:#ffffff;text-align:center;}#paper2agent-flow .edgeLabel p{background-color:#ffffff;}#paper2agent-flow .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#paper2agent-flow .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#paper2agent-flow .cluster rect{fill:hsl(30, 40%, 100%);stroke:hsl(30, 0%, 90%);stroke-width:1px;}#paper2agent-flow .cluster text{fill:rgb(0, 0, 0);}#paper2agent-flow .cluster span{color:rgb(0, 0, 0);}#paper2agent-flow div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;font-size:12px;background:hsl(30, 40%, 100%);border:1px solid hsl(30, 0%, 90%);border-radius:2px;pointer-events:none;z-index:100;}#paper2agent-flow .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#172033;}#paper2agent-flow rect.text{fill:none;stroke-width:0;}#paper2agent-flow .icon-shape,#paper2agent-flow .image-shape{background-color:#ffffff;text-align:center;}#paper2agent-flow .icon-shape p,#paper2agent-flow .image-shape p{background-color:#ffffff;padding:2px;}#paper2agent-flow .icon-shape rect,#paper2agent-flow .image-shape rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#paper2agent-flow .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#paper2agent-flow .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#paper2agent-flow :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="paper2agent-flow_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="paper2agent-flow_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="paper2agent-flow_flowchart-v2-circleEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="11" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="paper2agent-flow_flowchart-v2-circleStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="-1" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="paper2agent-flow_flowchart-v2-crossEnd" class="marker cross flowchart-v2" viewBox="0 0 11 11" refX="12" refY="5.2" m