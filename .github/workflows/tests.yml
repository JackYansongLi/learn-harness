name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  provided_tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m 'not exercise' -q
      # CI 检查已提供的工具；学生本地运行全部测试检查作业。
