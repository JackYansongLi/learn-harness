[project]
name = "learn-harness"
version = "0.1.0"
description = "用 OpenAI SDK 和 DeepSeek 学习 Subagent：教程、作业与测试"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "openai>=2.0,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1.0,<2",
    "rich>=14,<15",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = [
    "exercise: 需要完成作业的测试",
    "exercise1: 第一题，主循环调用论文 Subagent 和环境 Subagent",
    "exercise2: 第二题，复现难度 Subagent 及三个 Subagent 协作",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
