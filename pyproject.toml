[project]
name = "learn-harness"
version = "0.1.0"
description = "用 OpenAI SDK 和 DeepSeek 学习 subagent：教程、作业与测试"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "openai>=2.0,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1.0,<2",
    "rich>=14,<15",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
markers = ["exercise: 需要完成子助手创建与调用的测试"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
